name: Build Involeap.exe
on:
  workflow_dispatch:      # press "Run workflow" in the Actions tab
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller requests Pillow
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name Involeap --hidden-import PIL._tkinter_finder gui.py
      - run: Copy-Item .env.example dist/.env.example
      - uses: actions/upload-artifact@v4
        with:
          name: Involeap-windows
          path: dist/
